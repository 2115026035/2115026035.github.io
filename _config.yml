###########################################################
### 我的网站配置
###########################################################

############################
# --- 必改项 --- #
############################

# 网站名称（显示在首页大标题）
title: 网页demo

# 你的名字（显示在页脚）
author: 吴

###############################################
# --- 导航栏链接 --- #
###############################################

navbar-links:
  About Me: "aboutme"

################
# --- 头像 --- #
################

# 不想要头像就删掉下面这一行
avatar: "/assets/img/avatar-icon.png"
round-avatar: true

#####################################
# --- 页脚社交链接 --- #
#####################################

social-network-links:
  email: "你的邮箱@example.com"
  rss: true
  github: 2115026035

# RSS 订阅源的描述
rss-description: 记录我的学习与生活

###########################
# --- 通用选项 --- #
###########################

share-links-active:
  twitter: false
  facebook: false
  linkedin: false
  vk: false
  reddit: false

# 页脚显示的网址文字
url-pretty: "2115026035.github.io"

title-on-all-pages: true
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true
post_search: true
edit_page_button: true
navbar-var-length: false

######################################
# --- 配色 --- #
######################################

page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#0085A1"
navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#0085A1"

################
# --- 其他 --- #
################

date_format: "%Y年%-m月%-d日"

#################################################################################
# --- 以下一般不用动 --- #
#################################################################################

# 时区改成中国（原来是 America/Toronto，帖子日期会错）
timezone: "Asia/Shanghai"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
